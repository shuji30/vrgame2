<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Track designs</title></head>
<body style="margin:0;background:#fff">
<canvas id="c" width="1600" height="1100"></canvas>
<script type="module">
import { close, trace } from './turtle.mjs';
import { DESIGNS } from './designs.mjs';
const c = document.getElementById('c'), ctx = c.getContext('2d');
ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
const ids = Object.keys(DESIGNS);
const cols = 2, W = c.width / cols, H = c.height / Math.ceil(ids.length / cols);
ids.forEach((id, n) => {
  const d = DESIGNS[id];
  let r;
  const raw = new URLSearchParams(location.search).get('raw') === '1';
  try { r = raw ? trace(d.cmds) : trace(close(d.cmds, d.turn).cmds); } catch (e) { r = trace(d.cmds); }
  const xs = r.pts.map((p) => p[0]), zs = r.pts.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minZ = Math.min(...zs), maxZ = Math.max(...zs);
  const sc = Math.min((W - 80) / (maxX - minX), (H - 80) / (maxZ - minZ));
  const ox = (n % cols) * W + 40 - minX * sc, oz = Math.floor(n / cols) * H + 50 - minZ * sc;
  ctx.lineWidth = Math.max(2, 15 * sc); ctx.strokeStyle = '#555'; ctx.lineJoin = 'round';
  ctx.beginPath(); r.pts.forEach((p, i) => (i ? ctx.lineTo(ox + p[0] * sc, oz + p[1] * sc) : ctx.moveTo(ox + p[0] * sc, oz + p[1] * sc))); ctx.stroke();
  ctx.fillStyle = '#e00'; ctx.beginPath(); ctx.arc(ox, oz, 6, 0, 7); ctx.fill();
  ctx.fillStyle = '#000'; ctx.font = 'bold 22px sans-serif'; ctx.fillText(`${d.name} (${d.sub}) ${Math.round(r.s)}m`, (n % cols) * W + 10, Math.floor(n / cols) * H + 26);
  // マークの位置
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#06c';
  const full = raw ? trace(d.cmds, 1) : trace(close(d.cmds, d.turn).cmds, 1);
  for (const [k, s] of Object.entries(full.marks)) {
    const p = full.pts[Math.min(full.pts.length - 1, Math.round(s))] || full.pts[0];
    ctx.fillText(k, ox + p[0] * sc + 6, oz + p[1] * sc - 6);
  }
});
c.toBlob((b) => fetch('/__snap?name=tracks', { method: 'PUT', body: b }), 'image/jpeg', 0.9);
</script></body></html>
