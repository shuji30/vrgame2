# デバイスブリッジ（ffb-bridge）の配布用 ZIP（downloads/ffb-bridge.zip）を、Windows で exe にして作り直す。
# 使う人は Python を入れなくてよい（exe に Python と SDL2 が入っている）。中身は scripts/deploy.mjs の buildBridge と同じ作り方。
#   - ffb-bridge/ を直して main に push したとき、または Actions の画面から手動（Run workflow）で動く
#   - ZIP が変わったら、downloads/ffb-bridge.zip をコミットして main に push する（GitHub Pages に出る）
name: build-ffb-bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ffb-bridge/bridge.py'
      - 'ffb-bridge/requirements.txt'
      - 'ffb-bridge/README.txt'
      - 'ffb-bridge/origins.txt'
      - 'ffb-bridge/*.bat'
      - '.github/workflows/build-ffb-bridge.yml'

permissions:
  contents: write

concurrency:
  group: build-ffb-bridge
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: exe を作る（PyInstaller）
        working-directory: ffb-bridge
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm --onedir --console --name TurboKartBridge --collect-all sdl2dll --distpath ..\.bridge\dist --workpath ..\.bridge\work --specpath ..\.bridge bridge.py

      - name: 起動できるか確かめる（--help）
        run: .bridge\dist\TurboKartBridge\TurboKartBridge.exe --help

      - name: ZIP にする
        shell: pwsh
        run: |
          $z = ".bridge\zip\ffb-bridge"
          New-Item -ItemType Directory -Force $z | Out-Null
          Copy-Item -Recurse ".bridge\dist\TurboKartBridge\*" $z
          foreach ($n in 'README.txt', 'origins.txt', 'start.bat', 'install-autostart.bat', 'uninstall-autostart.bat') { Copy-Item "ffb-bridge\$n" $z }
          New-Item -ItemType Directory -Force downloads | Out-Null
          Remove-Item -Force downloads\ffb-bridge.zip -ErrorAction SilentlyContinue
          # Windows 付属の tar（bsdtar）で ZIP を作る（deploy.mjs と同じ）
          & "$env:SystemRoot\System32\tar.exe" -a -cf downloads\ffb-bridge.zip -C .bridge\zip ffb-bridge
          if ($LASTEXITCODE -ne 0) { throw "ZIP を作れませんでした" }
          Get-Item downloads\ffb-bridge.zip | Format-List Name, Length

      - name: コミットして push
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/ffb-bridge.zip
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Output "ZIP は変わっていません"; exit 0 }
          git commit -m "ffb-bridge.zip を作り直す（${{ github.sha }} の ffb-bridge から）"
          for ($i = 0; $i -lt 4; $i++) {
            git pull --rebase --autostash origin main
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (5 * ($i + 1))
          }
          throw "push できませんでした"
